# Site
repository: akahello/akahello.github.io

# Content configuration version
version: 2

# Personal info
name: akahello
title: "机器学习研究者 · 机器遗忘 / AI 安全 / 强化学习"
description: "akahello 的个人简历 — 机器遗忘 / AI 安全与隐私 / 强化与模仿学习"
website: https://akahello.github.io
website_title: akahello.github.io

# Dark Mode (true/false/never)
darkmode: false

# Social links
github_username: akahello

# About Section
about_profile_image: images/profile.jpg
about_content: | # this will include new lines to allow paragraphs
  你好，我是 akahello，一名机器学习研究者。

  目前主要关注 <mark>机器遗忘（Machine Unlearning）</mark> —— 如何让已训练的模型"忘掉"特定数据，以及围绕它的安全与隐私问题（后门攻防、成员推断、差分隐私）。同时对强化与模仿学习、大模型与智能体方向保持浓厚兴趣。

  这个页面由 [modern-resume-theme](https://github.com/sproogen/modern-resume-theme) 驱动。

content:
  - title: 研究方向 # Title for the section
    layout: list # Type of content section (list/text)
    content:
      - layout: left
        border: weak
        title: 机器遗忘
        sub_title: Machine Unlearning
        description: |
          如何在已训练的模型中移除特定数据的影响：基于 WGAN 的遗忘方法、遗忘攻击（unlearning inversion attacks）与遗忘效果评估。
      - layout: left
        border: weak
        title: AI 安全与隐私
        sub_title: Security & Privacy
        description: |
          后门攻防（BackdoorBench / BackdoorBox）、成员推断、对抗样本与差分隐私。
      - layout: left
        border: weak
        title: 强化与模仿学习
        sub_title: RL / Imitation Learning
        description: |
          PPO、A2C、GAIL 等算法在调度、自动驾驶等决策环境中的实现与研究。
      - layout: left
        title: 大模型与智能体
        sub_title: LLM & Agents
        description: |
          小型 GPT 从零训练（minimind / Steel-LLM），LLM 辅助科研与工程工具链。

  - title: 项目经历 # Title for the section
    layout: list # Type of content section (list/text)
    content:
      - layout: left
        border: weak
        title: GAIL — 生成对抗模仿学习
        sub_title: Python · PyTorch
        quote: >
          从专家演示中直接习得策略
        description: |
          实现 Generative Adversarial Imitation Learning 及相关实验。
        additional_links:
          - title: akahello/GAIL
            icon: fab fa-github
            url: https://github.com/akahello/GAIL
      - layout: left
        border: weak
        title: DRL_IL_ADV — 深度强化学习算法集
        sub_title: Python
        quote: >
          PPO / A2C / 模仿学习 / 对抗样本的统一实验框架
        description: |
          统一实现的深度强化学习算法与模仿学习、对抗样本实验集合。
        additional_links:
          - title: akahello/DRL_IL_ADV
            icon: fab fa-github
            url: https://github.com/akahello/DRL_IL_ADV
      - layout: left
        border: weak
        title: wgan-unlearn — 基于 WGAN 的机器遗忘
        sub_title: Python · PyTorch
        quote: >
          用生成对抗网络辅助遗忘特定样本的痕迹
        description: |
          探索生成模型在机器遗忘任务中的应用。
        additional_links:
          - title: akahello/wgan-unlearn
            icon: fab fa-github
            url: https://github.com/akahello/wgan-unlearn
      - layout: left
        border: weak
        title: AD — 异常检测
        sub_title: Python
        quote: >
          Anomaly Detection 方法实验
        description: |
          异常检测方法实现与实验。
        additional_links:
          - title: akahello/AD
            icon: fab fa-github
            url: https://github.com/akahello/AD
      - layout: left
        border: weak
        title: patent-disclosure-skill — 专利交底书技能
        sub_title: Python · LLM
        quote: >
          基于 LLM 的中国专利辅助工具
        description: |
          专利点挖掘、发明交底书编写、政策动向分析与审查意见辅助答复。
        additional_links:
          - title: akahello/patent-disclosure-skill
            icon: fab fa-github
            url: https://github.com/akahello/patent-disclosure-skill
      - layout: left
        title: academic_paper_page — 学术论文主页
        sub_title: JavaScript
        quote: >
          为学术论文生成可分享的单页站点
        description: |
          学术论文单页展示站点生成工具。
        additional_links:
          - title: akahello/academic_paper_page
            icon: fab fa-github
            url: https://github.com/akahello/academic_paper_page

  - title: 专业技能 # Title for the section
    layout: text # Type of content section (list/text)
    content: |
      **编程语言** — Python（主力）、JavaScript、C++、LaTeX

      **框架与工具** — PyTorch、OpenAI Gym / HighwayEnv、Git、Linux

      **研究领域** — 机器遗忘、后门攻防、差分隐私、深度强化学习

      **GitHub** — 自 2021 年起维护 100+ 公开仓库

# Footer
footer_show_references: false

# Build settings
remote_theme: sproogen/modern-resume-theme

sass:
  sass_dir: _sass
  style: compressed

plugins:
 - jekyll-seo-tag

exclude : [
  "Gemfile",
  "Gemfile.lock",
  "node_modules",
  "vendor/bundle/",
  "vendor/cache/",
  "vendor/gems/",
  "vendor/ruby/",
  "lib/",
  "scripts/",
  "docker-compose.yml",
  ]
